server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

spring:
  config:
    import:
      - optional:file:../.env[.properties]
      - optional:file:.env[.properties]
  application:
    name: nextpick-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/nextpick}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  cache:
    type: caffeine

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

security:
  jwt:
    secret: ${JWT_SECRET}
    access-expiration-ms: ${JWT_ACCESS_EXPIRATION_MS:900000}
    refresh-expiration-ms: ${JWT_REFRESH_EXPIRATION_MS:604800000}
  refresh-cookie:
    secure: ${REFRESH_COOKIE_SECURE:false}
    same-site: ${REFRESH_COOKIE_SAME_SITE:Strict}
    path: /api/auth
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200}

tmdb:
  base-url: ${TMDB_BASE_URL:https://api.themoviedb.org/3}
  access-token: ${TMDB_ACCESS_TOKEN}
  language: ${TMDB_LANGUAGE:es-ES}
  region: ${TMDB_REGION:ES}
  image-base-url: ${TMDB_IMAGE_BASE_URL:https://image.tmdb.org/t/p}
  connect-timeout: ${TMDB_CONNECT_TIMEOUT:3s}
  request-timeout: ${TMDB_REQUEST_TIMEOUT:8s}
  max-retries: ${TMDB_MAX_RETRIES:2}

ai:
  provider: ${AI_PROVIDER:openai}
  api-key: ${AI_API_KEY:}
  gemini-api-key: ${GEMINI_API_KEY:}
  base-url: ${AI_BASE_URL:}
  model: ${AI_MODEL:}
  connect-timeout: ${AI_CONNECT_TIMEOUT:5s}
  request-timeout: ${AI_REQUEST_TIMEOUT:60s}
  max-history-messages: ${AI_MAX_HISTORY_MESSAGES:12}

nextpick:
  cache:
    lists-ttl: ${CACHE_LISTS_TTL:30m}
    search-ttl: ${CACHE_SEARCH_TTL:10m}
    details-ttl: ${CACHE_DETAILS_TTL:12h}
    configuration-ttl: ${CACHE_CONFIGURATION_TTL:24h}
